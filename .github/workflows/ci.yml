# ------------------------------------------------------------------------------
# Minimal GitHub Actions — runs on every PR/push to main.
#
# • Layers in non-CARLA modules are 100% testable in CI.
# • Tests tagged @pytest.mark.carla are intentionally skipped in CI
#   (they would need a CARLA server running on the runner).
# ------------------------------------------------------------------------------

name: EdgeForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: edgeforge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff, non-blocking)
        run: |
          ruff check edgeforge --exit-zero

      - name: Run tests (skip carla/perception-gpu tests)
        working-directory: edgeforge
        run: |
          pytest -m "not carla and not perception" \
                 --cov=edgeforge \
                 --cov-report=term \
                 --cov-fail-under=40

      - name: Smoke-test main.py demo end-to-end
        working-directory: edgeforge
        run: |
          python main.py demo
