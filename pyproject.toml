# ------------------------------------------------------------------------------
# EdgeForge — Python packaging / tooling config
#
# Single file (PEP 621) that covers:
#   • pytest discovery + coverage
#   • ruff (recommended linter – optional, will gracefully fall back if not installed)
#   • mypy type-checking defaults
# No need for a setup.py; this is enough for `pip install -e .` if needed later.
# ------------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeforge"
version = "0.1.0"
description = "EdgeForge — autonomous driving simulation and risk-analysis platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []   # install from requirements.txt (not duplicated here)
authors = [{ name = "EdgeForge Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["edgeforge*"]
exclude = ["*tests*", "*scenarios/generated*", "*__pycache__*"]

# ---------------- pytest ----------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=edgeforge",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "slow: tests that require a running CARLA instance.",
    "carla: tests that require a running CARLA instance.",
    "perception: tests that use YOLO / torch.",
]

# ---------------- ruff (optional fast linter) --------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"edgeforge/simulation/*.py" = ["F401"]  # allow unused carla imports

# ---------------- mypy ------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "carla.*"
ignore_missing_imports = true
